<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoKey: Valence & Harmony</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#000000',
              surface: '#000000',
              primary: '#00ff41',
              neonViolet: '#D000FF',
              hackerGreen: '#00ff41',
            },
            fontFamily: {
              sans: ['Fira Code', 'monospace'],
              mono: ['Fira Code', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #000000;
        color: #00ff41;
        font-family: 'Fira Code', monospace;
        overflow-x: hidden;
      }
      
      .terminal-box {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.7), rgba(0, 0, 0, 0.9));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(208, 0, 255, 0.4);
        box-shadow: 
          0 8px 32px 0 rgba(0, 0, 0, 0.8),
          inset 0 0 15px rgba(208, 0, 255, 0.1),
          inset 0 0 2px rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .terminal-box:hover {
        border-color: rgba(208, 0, 255, 0.6);
        box-shadow: 
          0 12px 48px 0 rgba(0, 0, 0, 0.9),
          inset 0 0 20px rgba(208, 0, 255, 0.15);
      }

      .hacker-text {
        color: #00ff41;
        text-shadow: 
          0 0 5px rgba(0, 255, 65, 0.8),
          0 0 10px rgba(0, 255, 65, 0.4),
          0 0 15px rgba(0, 255, 65, 0.2);
        letter-spacing: -0.02em;
      }

      .hacker-text-dim {
        color: rgba(0, 255, 65, 0.6);
        text-shadow: 0 0 4px rgba(0, 255, 65, 0.3);
      }

      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(208, 0, 255, 0.4); 
        box-shadow: 0 0 10px rgba(208, 0, 255, 0.2);
        border-radius: 10px;
        border: 2px solid black;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(208, 0, 255, 0.7); 
      }

      input[type="range"] {
        accent-color: #D000FF;
      }
      
      button {
        text-transform: uppercase;
        letter-spacing: 0.12em;
        border-radius: 6px;
      }

      /* Animation for glass shine */
      @keyframes shine {
        from { transform: translateX(-100%) skewX(-20deg); }
        to { transform: translateX(200%) skewX(-20deg); }
      }

      .glass-shine {
        position: relative;
        overflow: hidden;
      }
      .glass-shine::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        animation: shine 4s infinite linear;
        pointer-events: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0",
    "d3": "https://aistudiocdn.com/d3@^7.9.0",
    "wavesurfer.js": "https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js",
    "wavesurfer.js/dist/plugins/regions.esm.js": "https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.esm.js",
    "wavesurfer.js/": "https://aistudiocdn.com/wavesurfer.js@^7.11.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
